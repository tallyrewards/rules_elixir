# CI covers the latest two Elixir minors against the latest two OTP majors.
# Elixir supports a moving window of OTP majors (1.20 covers 27-29, 1.19 covers
# 26-28), so the pairs are pinned explicitly rather than crossed: crossing them
# would generate combinations Elixir does not support. Earlier versions may work
# but are not tested here. See the supported versions table in README.md.
#
# The Bazel matrix lives in .bcr/presubmit.yml, which covers 8.x and 9.x. These
# jobs use the version pinned in .bazelversion.
name: Test
on:
  push:
    branches:
      - main
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - otp: "28.5"
            elixir: "1.19.5-otp-28"
          - otp: "29.0"
            elixir: "1.20.3-otp-29"
    steps:
      - name: CHECKOUT REPOSITORY
        uses: actions/checkout@v4
      - name: SETUP ERLANG/ELIXIR
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
          elixir-version: ${{ matrix.elixir }}
      - name: CONFIGURE
        run: |
          echo "build --color=yes" >> user.bazelrc
      - name: BUILD
        run: |
          bazelisk test //... \
            --verbose_failures --test_output=errors
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - otp: "28.5"
            elixir: "1.19.5-otp-28"
          - otp: "29.0"
            elixir: "1.20.3-otp-29"
    steps:
      - name: CHECKOUT REPOSITORY
        uses: actions/checkout@v4
      - name: SETUP ERLANG/ELIXIR
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
          elixir-version: ${{ matrix.elixir }}
      - name: CONFIGURE
        working-directory: test
        run: |
          echo "build --color=yes" >> user.bazelrc
      - name: BUILD & TEST
        working-directory: test
        run: |
          bazelisk test //...
      - name: CHECK LOGS
        working-directory: test
        # Elixir 1.20 replaced "N tests, M failures" with "Result: N passed", so
        # both spellings are accepted while the matrix spans 1.19 and 1.20.
        run: |
          grep -E "Result: 2 passed|2 tests, 0 failures" \
            bazel-testlogs/two_file_test/test.log
      - name: EXPECTED FAILURES FAIL
        working-directory: test
        run: |
          ! bazelisk test //:failing_test
          ! bazelisk test //:broken_test
          ! bazelisk test //:empty_test
      - name: UPLOAD TEST LOGS
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bazel-testlogs-${{ matrix.otp }}
          path: |
            test/bazel-testlogs/*
  examples-basic:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - otp: "28.5"
            elixir: "1.19.5-otp-28"
          - otp: "29.0"
            elixir: "1.20.3-otp-29"
    steps:
      - name: CHECKOUT REPOSITORY
        uses: actions/checkout@v4
      - name: SETUP ERLANG/ELIXIR
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
          elixir-version: ${{ matrix.elixir }}
      - name: CONFIGURE
        working-directory: examples/basic
        run: |
          echo "build --color=yes" >> user.bazelrc
      - name: BUILD & TEST
        working-directory: examples/basic
        run: |
          bazelisk test //...
      - name: UPLOAD TEST LOGS
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bazel-testlogs-examples-basic-${{ matrix.otp }}
          path: |
            examples/basic/bazel-testlogs/*
  examples-internal-elixir:
    # Builds both Erlang and Elixir from source, so it pins its own versions in
    # MODULE.bazel and takes no setup-beam. Single configuration by design.
    runs-on: ubuntu-latest
    steps:
      - name: CHECKOUT REPOSITORY
        uses: actions/checkout@v4
      - name: INSTALL OTP BUILD DEPS
        run: |
          sudo apt-get update && \
          sudo apt-get install -y \
            build-essential \
            libncurses-dev \
            libssl-dev
      - name: DISK CACHE
        uses: actions/cache@v4
        with:
          path: /home/runner/disk-cache/
          key: bazel-${{ github.ref }}
          restore-keys: |
            bazel-
      - name: CONFIGURE
        working-directory: examples/internal-elixir
        run: |
          cat << EOF >> user.bazelrc
            build --disk_cache=/home/runner/disk-cache
            build --color=yes
          EOF
      - name: BUILD & TEST
        working-directory: examples/internal-elixir
        env:
          ELIXIR_ERL_OPTIONS: +fnu
        run: |
          bazelisk test //... \
            --config=ie-29 \
            --verbose_failures
      - name: UPLOAD TEST LOGS
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bazel-testlogs-examples-internal-elixir
          path: |
            examples/internal-elixir/bazel-testlogs/*

  examples-distributions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29.0"
          elixir-version: "1.20.3-otp-29"
      - name: Test source and precompiled Elixir distributions
        working-directory: examples/distributions
        run: bazelisk test //... --test_output=errors

  examples-mix:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            otp: "28.5"
            elixir: "1.19.5-otp-28"
          - os: ubuntu-latest
            otp: "29.0"
            elixir: "1.20.3-otp-29"
          - os: macos-latest
            otp: "29.0"
            elixir: "1.20.3-otp-29"
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
          elixir-version: ${{ matrix.elixir }}
      - name: Test Mix application example
        working-directory: examples/mix
        run: bazelisk test //... --test_output=errors
      - name: Check that edits rerun only the actions that read them
        env:
          BAZEL: bazelisk
        run: python3 examples/mix/invalidation_test.py
      - name: Reject native artifacts for an unsupported architecture
        working-directory: examples/mix
        run: |
          if bazelisk build //wrong_native:app > "$RUNNER_TEMP/wrong-native.log" 2>&1; then
            cat "$RUNNER_TEMP/wrong-native.log"
            exit 1
          fi
          grep -F "contains linux/machine-0, expected" "$RUNNER_TEMP/wrong-native.log"
